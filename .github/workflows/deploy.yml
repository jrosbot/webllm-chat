name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master, work]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Pin the image so runner migrations cannot silently change the build.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies (retry transient failures)
        run: |
          for attempt in 1 2 3; do
            if npm ci; then
              exit 0
            else
              install_status=$?
            fi
            if [ "$attempt" -eq 3 ]; then
              exit "$install_status"
            fi
            delay=$((attempt * 10))
            echo "npm ci failed with exit code ${install_status}; retrying in ${delay}s (attempt $((attempt + 1))/3)."
            sleep "$delay"
          done
      - run: npm run build
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
