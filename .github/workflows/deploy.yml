name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master, work]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Pin the image so runner migrations cannot silently change the build.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Pages is already configured to use GitHub Actions. Omitting `token`
      # would also use github.token by default, but passing the built-in token
      # explicitly makes it impossible to accidentally restore the old empty
      # PAGES_TOKEN secret while resolving future merge conflicts.
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
        with:
          token: ${{ github.token }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
